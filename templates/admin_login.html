{% extends "base.html" %}

{% block title %}Admin — přihlášení{% endblock %}

{% block body_content %}
<section class="mx-auto max-w-md px-4 py-12">
  <div class="kajovo-surface kajovo-card" style="display:grid;gap:16px;">
    <header>
      <h1 style="margin:0;font-size:24px;font-weight:900;">Admin přihlášení</h1>
      <p class="kajovo-subtitle">Autorizovaný vstup do administrace hotel.hcasc.cz</p>
    </header>

    {% if flash_error %}
      <div class="kajovo-alert kajovo-alert--critical">{{ flash_error }}</div>
    {% endif %}

    <form method="post" action="/admin/login" class="kajovo-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="kajovo-field">
        <label for="username">Uživatelské jméno</label>
        <input id="username" name="username" type="text" required autocomplete="username" />
      </div>
      <div class="kajovo-field">
        <label for="password">Heslo</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button type="submit" class="kajovo-btn kajovo-btn--primary">Přihlásit</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
