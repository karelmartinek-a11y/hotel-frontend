{% extends "base.html" %}

{% block title %}Portál — přihlášení{% endblock %}

{% block body_content %}
<section class="mx-auto max-w-md px-4 py-12">
  <div class="kajovo-surface kajovo-card" style="display:grid;gap:16px;">
    <header>
      <h1 style="margin:0;font-size:24px;font-weight:900;">Přihlášení do portálu</h1>
      <p class="kajovo-subtitle">Přihlaste se svým účtem pro práci v systému.</p>
    </header>

    {% if flash_error %}
      <div class="kajovo-alert kajovo-alert--critical">{{ flash_error }}</div>
    {% endif %}

    <form method="post" action="/login" class="kajovo-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="kajovo-field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="uzivatel@hotel.hcasc.cz" />
      </div>
      <div class="kajovo-field">
        <label for="password">Heslo</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <a href="/login/forgot" style="font-size:13px;color:var(--kajovo-accent-2);font-weight:700;">Zapomněli jste heslo?</a>
        <button type="submit" class="kajovo-btn kajovo-btn--primary">Přihlásit</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
