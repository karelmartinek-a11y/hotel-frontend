{% extends "base.html" %}

{% block title %}Portál — nové heslo{% endblock %}

{% block body_content %}
<section class="mx-auto max-w-md px-4 py-12">
  <div class="kajovo-surface kajovo-card" style="display:grid;gap:16px;">
    <header>
      <h1 style="margin:0;font-size:24px;font-weight:900;">Nastavení nového hesla</h1>
      <p class="kajovo-subtitle">Odkaz je platný 24 hodin.</p>
    </header>

    {% if flash_error %}
      <div class="kajovo-alert kajovo-alert--critical">{{ flash_error }}</div>
    {% endif %}

    <form method="post" action="/login/reset" class="kajovo-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input type="hidden" name="token" value="{{ token }}" />
      <div class="kajovo-field">
        <label for="password">Nové heslo</label>
        <input id="password" name="password" type="password" required minlength="10" />
      </div>
      <div class="kajovo-field">
        <label for="password_confirm">Potvrzení hesla</label>
        <input id="password_confirm" name="password_confirm" type="password" required minlength="10" />
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button type="submit" class="kajovo-btn kajovo-btn--primary">Uložit heslo</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
